name: e2e-android

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario ID to execute
        required: true
        default: all-correctness
        type: string
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb254670f6c6b5dbe9e7d6f0fb4d4f7
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android API 35 image
        run: sdkmanager 'platform-tools' 'emulator' 'platforms;android-35' 'system-images;android-35;google_apis;x86_64'
      - name: Verify repository gates
        run: make verify
      - name: Build and prepare AVDs
        run: |
          make relay-build
          make mobile-verify
          ./e2e/scripts/prepare-avds.sh
      - name: Run requested scenario
        env:
          E2E_SCENARIO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scenario || 'post' }}
          E2E_KEEP_RUN_DIR: '1'
          E2E_RUN_DIR_FILE: ${{ runner.temp }}/e2e-run-dir
        run: make e2e-emulator
      - name: Upload sanitized E2E evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-sanitized"
          RUN_DIR=$(cat "$RUNNER_TEMP/e2e-run-dir")
          for artifact in health-a.json health-b.json state.json timeline.json metrics.json; do
            test -n "$RUN_DIR" && test -f "$RUN_DIR/sanitized/$artifact" && cp "$RUN_DIR/sanitized/$artifact" "$RUNNER_TEMP/e2e-sanitized/$artifact"
          done
      - name: Upload sanitized E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-android-evidence
          path: |
            ${{ runner.temp }}/e2e-sanitized/health-a.json
            ${{ runner.temp }}/e2e-sanitized/health-b.json
            ${{ runner.temp }}/e2e-sanitized/state.json
            ${{ runner.temp }}/e2e-sanitized/timeline.json
            ${{ runner.temp }}/e2e-sanitized/metrics.json
            .superpowers/sdd/reports/e2e-task-*.md
          if-no-files-found: warn
