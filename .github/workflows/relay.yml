name: relay
on:
  push:
    paths: ['relay/**', 'proto/**', 'deploy/**', 'Makefile', 'scripts/verify-generated-clean.sh', 'docs/superpowers/specs/**', 'docs/superpowers/plans/**', '.github/workflows/relay.yml']
  pull_request:
    paths: ['relay/**', 'proto/**', 'deploy/**', 'Makefile', 'scripts/verify-generated-clean.sh', 'docs/superpowers/specs/**', 'docs/superpowers/plans/**', '.github/workflows/relay.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Download Go modules
        working-directory: relay
        run: go mod download
      - name: Protocol and relay verification
        id: relay-verify
        shell: bash
        run: |
          set -o pipefail
          make relay-verify 2>&1 | tee relay-race.log
      - name: Upload relay race-test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-race-test-log
          path: relay-race.log
          if-no-files-found: error

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'
      - name: Resolve development Compose configuration
        run: docker compose -f deploy/docker-compose.yml config
      - name: Resolve production Compose configuration
        env:
          TWINOTIFY_DOMAIN: relay.example.test
        run: docker compose -f deploy/docker-compose.prod.yml config
      - name: Assert deployment security invariants
        run: make deployment-test
