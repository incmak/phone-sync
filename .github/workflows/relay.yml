name: relay
on:
  push:
    paths: ['relay/**', 'proto/**', 'Makefile', '.github/workflows/relay.yml']
  pull_request:
    paths: ['relay/**', 'proto/**', 'Makefile', '.github/workflows/relay.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Sync proto via Makefile
        run: make sync-proto
      - name: Tests
        working-directory: relay
        run: |
          go mod download
          go vet ./...
          go test ./... -race -count=1

  docker-and-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          push: false
          load: true
          tags: twinotify-relay:ci
      - name: Smoke test — run container and hit /health
        run: |
          docker run -d --name relay -p 8080:8080 twinotify-relay:ci
          sleep 2
          curl -sf http://localhost:8080/health
          docker logs relay
          docker rm -f relay
