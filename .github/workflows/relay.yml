name: relay
on:
  push:
    paths: ['relay/**', 'proto/**', 'Makefile', '.github/workflows/relay.yml']
  pull_request:
    paths: ['relay/**', 'proto/**', 'Makefile', '.github/workflows/relay.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: docker/setup-buildx-action@v3
      - name: Download Go modules
        working-directory: relay
        run: go mod download
      - name: Protocol and relay verification
        id: relay-verify
        shell: bash
        run: |
          set -o pipefail
          make relay-verify 2>&1 | tee relay-race.log
      - name: Upload relay race-test log on failure
        if: failure() && steps.relay-verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: relay-race-test-log
          path: relay-race.log
          if-no-files-found: error

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve development Compose configuration
        run: docker compose -f deploy/docker-compose.yml config
      - name: Resolve production Compose configuration
        env:
          TWINOTIFY_DOMAIN: relay.example.test
        run: docker compose -f deploy/docker-compose.prod.yml config
