name: relay
on:
  push:
    paths: ['relay/**', 'proto/**', 'deploy/**', 'Makefile', '.dockerignore', 'scripts/verify-generated-clean.sh', 'docs/superpowers/specs/**', 'docs/superpowers/plans/**', '.github/workflows/relay.yml', '.github/workflows/relay-image.yml']
  pull_request:
    paths: ['relay/**', 'proto/**', 'deploy/**', 'Makefile', '.dockerignore', 'scripts/verify-generated-clean.sh', 'docs/superpowers/specs/**', 'docs/superpowers/plans/**', '.github/workflows/relay.yml', '.github/workflows/relay-image.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.13'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Download Go modules
        working-directory: relay
        run: go mod download
      - name: Protocol and relay verification
        id: relay-verify
        shell: bash
        run: |
          set -o pipefail
          make relay-verify 2>&1 | tee relay-race.log
      - name: Upload relay race-test log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: relay-race-test-log
          path: relay-race.log
          if-no-files-found: error

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.13'
      - name: Resolve development Compose configuration
        run: docker compose -f deploy/docker-compose.yml config
      - name: Resolve production Compose configuration
        env:
          TWINOTIFY_DOMAIN: relay.example.test
          TWINOTIFY_RELAY_IMAGE: ghcr.io/incmak/twinotify-relay@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TWINOTIFY_BUILD_VERSION: relay-v0.0.0-test
        run: docker compose -f deploy/docker-compose.prod.yml config
      - name: Assert deployment security invariants
        run: make deployment-test
