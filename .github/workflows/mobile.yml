name: mobile
on:
  push:
    paths: ['mobile/**', 'e2e/**', 'proto/**', 'Makefile', 'scripts/verify-generated-clean.sh', 'scripts/verify-offline-pairing-evidence.sh', 'scripts/verify-release-evidence.sh', 'scripts/verify-host-workflows.sh', 'scripts/verify-host-workflows_test.sh', 'docs/superpowers/specs/**', 'docs/superpowers/plans/**', '.github/workflows/mobile.yml', '.github/workflows/e2e-host.yml']
  pull_request:
    paths: ['mobile/**', 'e2e/**', 'proto/**', 'Makefile', 'scripts/verify-generated-clean.sh', 'scripts/verify-offline-pairing-evidence.sh', 'scripts/verify-release-evidence.sh', 'scripts/verify-host-workflows.sh', 'scripts/verify-host-workflows_test.sh', 'docs/superpowers/specs/**', 'docs/superpowers/plans/**', '.github/workflows/mobile.yml', '.github/workflows/e2e-host.yml']

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - run: npx expo-doctor

  native-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - name: Sync committed protocol fixtures
        run: make sync-proto
        working-directory: .
      - run: npx expo prebuild --platform android --clean --no-install
      - run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: twinotify-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
        if: always()
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: twinotify-android-verification-reports
          path: |
            mobile/android/**/build/test-results/**
            mobile/android/**/build/reports/tests/**
            mobile/android/**/build/reports/**/lint-results*.html
            mobile/modules/twinotify-core/android/build/test-results/**
            mobile/modules/twinotify-core/android/build/reports/tests/**
            mobile/modules/twinotify-core/android/build/reports/lint-results-debug.html
          if-no-files-found: warn

  denylist-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify default-denylist.json SHA matches DenylistLoader constant
        run: |
          set -euo pipefail
          ASSET_SHA=$(shasum -a 256 mobile/modules/twinotify-core/android/src/main/assets/default-denylist.json | awk '{print $1}')
          # The Kotlin const declaration wraps the 64-char hex onto the line AFTER the
          # EXPECTED_SHA256_HEX field name. Scan forward from the field name and extract
          # the first 64-char lowercase-hex literal found after it.
          EXPECTED=$(awk '
            /EXPECTED_SHA256_HEX/,0 {
              if (match($0, /"[0-9a-f]{64}"/)) {
                s = substr($0, RSTART+1, RLENGTH-2); print s; exit
              }
            }' mobile/modules/twinotify-core/android/src/main/java/co/twinotify/core/filter/DenylistLoader.kt)
          echo "Asset SHA:    $ASSET_SHA"
          echo "Constant SHA: $EXPECTED"
          if [ "$ASSET_SHA" != "$EXPECTED" ]; then
            echo "::error::default-denylist.json SHA does not match EXPECTED_SHA256_HEX in DenylistLoader.kt."
            echo "If you intentionally changed the denylist, update the constant in the same commit."
            exit 1
          fi
