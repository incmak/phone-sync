name: e2e-host

on:
  push:
    paths:
      - 'e2e/**'
      - 'proto/**'
      - 'Makefile'
      - 'mobile/eas.json'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'scripts/verify-offline-pairing-evidence.sh'
      - 'scripts/verify-release-evidence.sh'
      - 'scripts/verify-notification-action-evidence.sh'
      - 'scripts/verify-notification-action-evidence_test.sh'
      - 'docs/release-evidence/notification-actions-schema.json'
      - 'scripts/verify-standalone-android.sh'
      - 'scripts/verify-android-release-workflow.sh'
      - 'scripts/verify-android-release_test.sh'
      - 'scripts/verify-host-workflows.sh'
      - 'scripts/verify-host-workflows_test.sh'
      - 'scripts/verify-lan-product-evidence.sh'
      - '.github/workflows/e2e-host.yml'
      - '.github/workflows/e2e-android.yml'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/android-release.yml'
  pull_request:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.25.13'
      - name: Run E2E Go race tests
        run: cd e2e && go test ./... -race -count=1
      - name: Vet E2E Go code
        run: cd e2e && go vet ./...
      - name: Verify direct LAN product host contract
        run: ./e2e/scripts/lan_product_target_test.sh
      - name: Verify notification action host contract
        run: ./e2e/scripts/notification_action_target_test.sh
      - name: Validate emulator workflow contract
        run: ./e2e/scripts/validate-workflow.sh
      - name: Run emulator preflight self-test
        run: ./e2e/scripts/preflight_test.sh
      - name: Verify offline-pairing evidence verifier
        run: ./scripts/verify-offline-pairing-evidence.sh --self-test
      - name: Verify release evidence verifier
        run: ./scripts/verify-release-evidence.sh --self-test
      - name: Verify notification action evidence verifier
        run: ./scripts/verify-notification-action-evidence_test.sh
      - name: Verify protected Android release contracts
        run: ./scripts/verify-android-release_test.sh
      - name: Verify host workflow contracts
        run: ./scripts/verify-host-workflows.sh
      - name: Run host workflow verifier self-test
        run: ./scripts/verify-host-workflows_test.sh
