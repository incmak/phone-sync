services:
  relay:
    image: "${TWINOTIFY_RELAY_IMAGE:?TWINOTIFY_RELAY_IMAGE is required}"
    environment:
      TWINOTIFY_ENV: "production"
      LISTEN_ADDR: ":8080"
      BOLT_PATH: "/data/twinotify-relay.db"
      TRUST_PROXY_HEADERS: "true"
      REQUIRE_MUTUAL_PAIR_SIGNATURES: "true"
      MIN_FREE_DISK_BYTES: "536870912"
      MAX_OPEN_CONNECTIONS: "512"
      BACKUP_DIR: "/backups"
      BACKUP_INTERVAL: "6h"
      BACKUP_RETENTION_COUNT: "14"
      BUILD_VERSION: "${TWINOTIFY_BUILD_VERSION:?TWINOTIFY_BUILD_VERSION is required}"
    expose:
      - "8080"
    volumes:
      - relay-data:/data
      - relay-backups:/backups
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/relay", "healthcheck", "--url", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    restart: unless-stopped
    networks:
      - relay-internal

  caddy:
    image: caddy:2.11.3-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    environment:
      TWINOTIFY_DOMAIN: "${TWINOTIFY_DOMAIN:?TWINOTIFY_DOMAIN is required}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      relay:
        condition: service_healthy
        required: true
    stop_grace_period: 15s
    restart: unless-stopped
    networks:
      - edge
      - relay-internal

volumes:
  relay-data:
  relay-backups:
  caddy-data:
  caddy-config:

networks:
  edge:
  relay-internal:
    internal: true
