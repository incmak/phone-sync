services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    container_name: twinotify-relay
    environment:
      LISTEN_ADDR: ":8080"
      BOLT_PATH: "/data/twinotify-relay.db"
    ports:
      - "8080:8080"  # Expose for local dev & Android emulator; remove when fronted by Caddy in prod.
    volumes:
      - relay-data:/data
    restart: unless-stopped
    networks:
      - twinotify-net

volumes:
  relay-data:

networks:
  twinotify-net:
