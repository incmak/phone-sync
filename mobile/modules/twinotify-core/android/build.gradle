plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'com.google.devtools.ksp' version '2.1.20-2.0.1'
}

group = 'co.twinotify.core'
version = '0.8.0'

android {
  namespace "co.twinotify.core"
  defaultConfig {
    minSdk 34
    versionCode 1
    versionName "0.8.0"
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  sourceSets {
    androidTest.assets.srcDirs += files("$projectDir/schemas")
  }
  lint {
    abortOnError true
    warningsAsErrors true
    // Network-backed dependency freshness is nondeterministic and is not a
    // source/API correctness check. Dependency upgrades remain deliberate.
    disable 'GradleDependency', 'NewerVersionAvailable'
  }
}

ksp {
  arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'com.goterl:lazysodium-android:5.2.0@aar'
  implementation 'net.java.dev.jna:jna:5.19.1@aar'
  implementation 'androidx.datastore:datastore-preferences:1.1.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
  implementation 'androidx.room:room-runtime:2.7.1'
  implementation 'androidx.room:room-ktx:2.7.1'
  ksp 'androidx.room:room-compiler:2.7.1'
  androidTestImplementation 'androidx.room:room-testing:2.7.1'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.test:runner:1.6.1'
  androidTestImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.22'
  testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.22'
  testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:1.9.22'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20231013'
}
